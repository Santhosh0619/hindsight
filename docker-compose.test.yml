services:
  db-test:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hindsight_e2e
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  api-test:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db-test:5432/hindsight_e2e
      JWT_SECRET: e2e-test-secret-not-for-production
      DEMO_MODE: "true"
      LLM_API_KEY: ""
      # web-test serves on :5174, not the default CORS allowlist's :5173 -- without
      # this, every browser-side POST from the e2e frontend (signup/login/demo) is
      # silently blocked by CORS.
      CORS_ORIGINS: http://localhost:5174
      # Playwright's browser talks to web-test over plain http://, so a Secure-flagged
      # refresh cookie would be silently withheld on every request after the first --
      # same root cause as ADR 0002 §5's httpx test-client fix, here for real-browser
      # e2e instead of vitest.
      COOKIE_SECURE: "false"
    volumes:
      - model-cache:/root/.cache/huggingface
    depends_on:
      db-test:
        condition: service_healthy
    ports:
      - "8001:8000"
    command: >
      sh -c "alembic upgrade head &&
             (python -c 'import app.seed.seed' 2>/dev/null &&
                python -m app.seed.seed ||
                echo 'app.seed.seed not present yet (Phase 11) -- skipping seed step') &&
             (python -c 'import app.services.evaluation.cli' 2>/dev/null &&
                python -m app.services.evaluation.cli --mode vector ||
                echo 'evaluation CLI not present yet (Phase 12) -- skipping eval step') &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker-test:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db-test:5432/hindsight_e2e
      JWT_SECRET: e2e-test-secret-not-for-production
      DEMO_MODE: "true"
      LLM_API_KEY: ""
    volumes:
      - model-cache:/root/.cache/huggingface
    depends_on:
      db-test:
        condition: service_healthy
    command: python -m app.workers.worker

  web-test:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    environment:
      VITE_API_URL: http://localhost:8001
    ports:
      - "5174:5173"
    depends_on:
      api-test:
        condition: service_healthy
    command: npm run dev -- --host 0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5173 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  # Same volume name as docker-compose.yml's dev stack -- both resolve to the same
  # Compose project (directory-based naming), so this reuses the already-downloaded
  # embedding model instead of redownloading it for every e2e run.
  model-cache:
