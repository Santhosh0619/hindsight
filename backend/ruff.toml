target-version = "py311"
line-length = 100
# Migration bodies are autogenerated from the models; hold them to correctness in
# review, not to hand-written style. env.py is still linted normally.
extend-exclude = ["alembic/versions"]

[lint]
select = ["E","W","F","I","B","UP","SIM","ANN"]
ignore = ["ANN401"]

[lint.per-file-ignores]
"tests/*" = ["ANN","S"]
"alembic/*" = ["ANN"]

[format]
quote-style = "double"
indent-style = "space"
