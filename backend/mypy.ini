[mypy]
# Type-checking target only — the app still requires/targets Python 3.11 at runtime
# (see pyproject.toml `requires-python` and backend/Dockerfile's `python:3.11-slim`).
# Bumped past 3.11 because installed numpy's bundled .pyi stubs (a transitive dependency
# via pgvector/sentence-transformers) use PEP 695 `type` statement syntax unconditionally,
# which mypy refuses to parse under python_version=3.11 regardless of per-module
# follow_imports/ignore_errors overrides — this is a parse-time restriction, not a
# semantic one. See docs/decisions/ for the dated ADR.
python_version = 3.12
strict = True
ignore_missing_imports = True
exclude = ^alembic/

[mypy-tests.*]
disallow_untyped_defs = False

[mypy-numpy]
# numpy's bundled .pyi stubs use PEP 695 `type` statements (Python 3.12+ syntax), which
# fails to parse under this project's python_version=3.11 target. numpy is a transitive
# dependency (via pgvector/sentence-transformers), not code we maintain — skip parsing
# its stubs entirely rather than raising the whole project's target version to work
# around one dependency's stub syntax. Both the bare module and its submodules need the
# override — "numpy.*" alone does not match the top-level "numpy" module.
follow_imports = skip

[mypy-numpy.*]
follow_imports = skip
