name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Author guard ─────────────────────────────────────────────────────────────
  author-check:
    name: No AI Attribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Commit messages
        run: |
          git log origin/main..HEAD --format="%s %b" | \
          grep -iE "(generated by claude|co-authored-by: claude|ai-assisted|claude-code)" \
          && { echo "ERROR: AI attribution in commit messages"; exit 1; } || echo "✓ Clean"

      - name: File contents
        run: |
          git diff origin/main..HEAD --name-only --diff-filter=ACM | while read f; do
            [[ -f "$f" ]] || continue
            grep -liE "(Generated by Claude|Co-authored-by: Claude|AI-assisted|claude-code)" "$f" \
            && { echo "ERROR: AI attribution in $f"; exit 1; } || true
          done
          echo "✓ No AI attribution in changed files"

  # ── Backend ───────────────────────────────────────────────────────────────────
  backend:
    name: Backend (ruff + mypy + pytest)
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hindsight_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: cd backend && pip install -e ".[dev]"
      - run: cd backend && ruff check .
      - run: cd backend && mypy app --strict
      - name: Run migrations
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/hindsight_ci
          JWT_SECRET: ci-secret-not-for-production
        run: cd backend && alembic upgrade head
      - name: pytest
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/hindsight_ci
          JWT_SECRET: ci-secret-not-for-production
          LLM_API_KEY: ""
        run: cd backend && pytest tests/ -v --tb=short -q --junit-xml=junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-junit
          path: backend/junit.xml

  # ── Frontend ──────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (tsc + prettier + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && npx tsc --noEmit
      - run: cd frontend && npx prettier --check "src/**/*.{ts,tsx,css,json}"
      - run: cd frontend && npm run build

  # ── Migration integrity ───────────────────────────────────────────────────────
  migrations:
    name: Migration up → down → up
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hindsight_migrate
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: cd backend && pip install -e ".[dev]"
      - env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/hindsight_migrate
          JWT_SECRET: ci-secret
        run: |
          cd backend
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          echo "✓ Migrations are reversible"

  # ── E2E ───────────────────────────────────────────────────────────────────────
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]   # only run if unit tests pass
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: cd backend && pip install -e ".[dev]"

      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: cd frontend && npm ci && npm run build

      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: cd e2e && npm ci && npx playwright install --with-deps chromium

      - name: Start test stack
        run: docker compose -f docker-compose.test.yml up -d --wait

      - name: Run Playwright
        env:
          E2E_BASE_URL: http://localhost:8001
          E2E_FRONTEND_URL: http://localhost:5174
          E2E_TEST_USER_EMAIL: e2e-test@hindsight.test
          E2E_TEST_USER_PASSWORD: E2eTestPassword123!
        run: cd e2e && npm run test

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.test.yml down

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
